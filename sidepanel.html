<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Paper AI Assistant</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f8f9fa;
      color: #202124;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #1a73e8;
    }
    .config-box {
      background: #fff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #dadce0;
      margin-bottom: 16px;
    }
    .config-box label {
      font-size: 12px;
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }
    .input-group {
      display: flex;
      gap: 6px;
    }
    input[type="password"] {
      flex: 1;
      padding: 8px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 12px;
    }
    button.btn-save {
      padding: 8px 12px;
      background-color: #3c4043;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .preview-box {
      background: #fff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #dadce0;
      margin-bottom: 16px;
      text-align: center;
    }
    #capturedImage {
      max-width: 100%;
      border-radius: 4px;
      display: none;
      margin: 0 auto;
      border: 1px solid #e8eaed;
    }
    .placeholder {
      font-size: 13px;
      color: #70757a;
      padding: 20px 0;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .btn-template {
      padding: 10px;
      background-color: #fff;
      border: 1px solid #1a73e8;
      color: #1a73e8;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-template:hover {
      background-color: #1a73e8;
      color: #fff;
    }
    .btn-template:disabled {
      border-color: #dadce0;
      color: #dadce0;
      cursor: not-allowed;
      background-color: #f1f3f4;
    }
    .result-box {
      background: #fff;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #dadce0;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 120px;
    }
    .loading {
      color: #1a73e8;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>🔬 논문 AI 해설 도구</h2>

  <!-- API Key 설정 영역 -->
  <div class="config-box">
    <label for="apiKeyInput">Gemini API Key 설정</label>
    <div class="input-group">
      <input type="password" id="apiKeyInput" placeholder="AI Studio API Key 입력" />
      <button id="saveApiKeyBtn" class="btn-save">저장</button>
    </div>
  </div>

  <!-- 캡처 이미지 미리보기 영역 -->
  <div class="preview-box">
    <div id="placeholder" class="placeholder">
      📄 논문 화면에서 분석할 영역을<br>드래그해 주세요.
    </div>
    <img id="capturedImage" alt="Captured Selection" />
  </div>

  <!-- 프롬프트 템플릿 버튼들 -->
  <div class="btn-grid">
    <button class="btn-template" data-type="translate">🌐 전문 번역</button>
    <button class="btn-template" data-type="figure">📊 Figure/그래프 해설</button>
    <button class="btn-template" data-type="concept">💡 용어/개념 설명</button>
    <button class="btn-template" data-type="formula">📐 수식/기호 풀이</button>
    <button class="btn-template" data-type="summary" style="grid-column: span 2;">📝 핵심 요약 (3줄)</button>
  </div>

  <!-- AI 분석 결과 출력 박스 -->
  <div id="resultBox" class="result-box">
    영역을 캡처한 후 위 분석 버튼을 클릭하세요.
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
