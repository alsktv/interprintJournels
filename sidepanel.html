<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Paper AI Assistant</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f8f9fa;
      color: #202124;
    }
    h2 {
      font-size: 1.1rem;
      color: #1a73e8;
      margin-top: 0;
    }
    .preview-box {
      width: 100%;
      border: 1px dashed #dadce0;
      border-radius: 8px;
      padding: 8px;
      box-sizing: border-box;
      background: #fff;
      text-align: center;
      margin-bottom: 16px;
    }
    .preview-box img {
      max-width: 100%;
      border-radius: 4px;
      display: none;
    }
    .placeholder {
      color: #5f6368;
      font-size: 0.85rem;
      padding: 20px 0;
    }
    .status {
      font-size: 0.9rem;
      color: #1a73e8;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <h2>🔬 논문 시각 분석 도구</h2>
  
  <div class="preview-box">
    <div id="placeholder" class="placeholder">화면에서 분석할 영역을 드래그하세요.</div>
    <img id="capturedImage" alt="Captured Area" />
  </div>

  <div id="status" class="status"></div>

  <script>
    chrome.runtime.onMessage.addListener((request) => {
      if (request.action === "sendCapturedImage") {
        const imgEl = document.getElementById("capturedImage");
        const placeholder = document.getElementById("placeholder");
        const status = document.getElementById("status");

        imgEl.src = request.image;
        imgEl.style.display = "block";
        placeholder.style.display = "none";

        status.textContent = "✅ 영역 캡처 완료! (다음 단계에서 AI 연동 예정)";
      }
    });
  </script>
</body>
</html>
