<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Paper AI Assistant</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f8f9fa;
      color: #202124;
    }
    h2 {
      font-size: 1.1rem;
      color: #1a73e8;
      margin-top: 0;
      margin-bottom: 12px;
    }
    .api-key-box {
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
    }
    .api-key-box label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #5f6368;
      margin-bottom: 4px;
    }
    .api-key-input-group {
      display: flex;
      gap: 6px;
    }
    .api-key-input-group input {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .api-key-input-group button {
      padding: 6px 10px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .preview-box {
      width: 100%;
      border: 1px dashed #dadce0;
      border-radius: 8px;
      padding: 8px;
      box-sizing: border-box;
      background: #fff;
      text-align: center;
      margin-bottom: 14px;
    }
    .preview-box img {
      max-width: 100%;
      border-radius: 4px;
      display: none;
    }
    .placeholder {
      color: #5f6368;
      font-size: 0.85rem;
      padding: 15px 0;
    }
    .template-label {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #3c4043;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .btn-template {
      padding: 10px 8px;
      background: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #1a73e8;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-template:hover {
      background: #e8f0fe;
      border-color: #1a73e8;
    }
    .btn-template:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .result-box {
      background: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 14px;
      font-size: 0.88rem;
      line-height: 1.6;
      white-space: pre-wrap;
      min-height: 100px;
    }
    .loading {
      color: #1a73e8;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>🔬 논문 AI 해설 도구</h2>

  <!-- Gemini API Key 설정 영역 -->
  <div class="api-key-box">
    <label for="apiKeyInput">Gemini API Key 설정</label>
    <div class="api-key-input-group">
      <input type="password" id="apiKeyInput" placeholder="AI Studio 키 입력" />
      <button id="saveApiKeyBtn">저장</button>
    </div>
  </div>

  <div class="preview-box">
    <div id="placeholder" class="placeholder">화면에서 분석할 영역을 드래그하세요.</div>
    <img id="capturedImage" alt="Captured Area" />
  </div>

  <div class="template-label">분석 유형 선택</div>
  <div class="btn-grid">
    <button class="btn-template" data-type="figure">📊 Figure/그래프 해석</button>
    <button class="btn-template" data-type="concept">💡 쉬운 개념 풀이</button>
    <button class="btn-template" data-type="summary">📝 3줄 핵심 요약</button>
    <button class="btn-template" data-type="formula">📐 수식/변수 설명</button>
  </div>

  <div id="resultBox" class="result-box">영역 선택 후 원하시는 분석 버튼을 누르세요.</div>

  <script src="sidepanel.js"></script>
</body>
</html>
